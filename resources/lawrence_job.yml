resources:
  jobs:
    lawrence_bronze_ingestion:
      name: lawrence_bronze_dex_ingestion
      # Phase 1 scope: DEX-only Bronze ingestion, multi-venue/multi-chain
      # (see notebook 00's VENUES list — add a chain/DEX there, not a new
      # task here). Add a separate task for the social-data Bronze source
      # once Phase 2 starts.
      schedule:
        quartz_cron_expression: "0 */15 * * * ?" # every 15 min — tune once
                                                  # you know real venue volume
        timezone_id: "UTC"
        pause_status: PAUSED # paused again 2026-09-15: continuous 15-min
                              # polling was projected to exhaust Bitquery API
                              # credits within days (see decisions.md).
                              # Switching to a bounded, one-time historical
                              # backfill instead of perpetual live polling --
                              # unpause only once that's designed and its
                              # actual credit cost is known.

      tasks:
        - task_key: bronze_dex_pool_events
          notebook_task:
            notebook_path: ../notebooks/archive/00_bronze_dex_ingestion.py  # archived 2026-10-22; job stays PAUSED
          # new_cluster / existing_cluster_id: fill in when not serverless
        - task_key: silver_token_trades
          depends_on:
            - task_key: bronze_dex_pool_events
          notebook_task:
            notebook_path: ../notebooks/01_silver_token_trades.py
          # Runs right after Bronze each cycle; its own LOOKBACK_MINUTES
          # (see notebook 01) is what makes a 15-min cadence safe, not this
          # depends_on -- it only orders the two tasks within one run.

    lawrence_dune_backfill:
      name: lawrence_dune_backfill
      # No schedule -- trigger manually (UI "Run now", or
      # `databricks jobs run-now --job-name lawrence_dune_backfill`) once
      # per resume, whenever the dune_api_key secret is swapped to a new
      # account. Exists specifically so this runs on a job cluster instead
      # of an attached interactive notebook: attached notebooks hit
      # "session_id is no longer usable ... INACTIVITY_TIMEOUT" (2026-09-15)
      # during long silent stretches (the backfill loop is almost pure
      # Python/requests against Dune's API, so it can go minutes without
      # touching Spark and gets treated as an idle session). Job runs
      # aren't tied to notebook-session activity the same way.
      tasks:
        - task_key: dune_backfill
          notebook_task:
            notebook_path: ../notebooks/00c_bronze_backfill_dune.py
          timeout_seconds: 21600 # 6h -- generous ceiling for a manual,
                                  # resumable, credit-bounded backfill run
