resources:
  jobs:
    lawrence_bronze_ingestion:
      name: lawrence_bronze_dex_ingestion
      # Phase 1 scope: DEX-only Bronze ingestion, multi-venue/multi-chain
      # (see notebook 00's VENUES list — add a chain/DEX there, not a new
      # task here). Add a separate task for the social-data Bronze source
      # once Phase 2 starts.
      schedule:
        quartz_cron_expression: "0 */15 * * * ?" # every 15 min — tune once
                                                  # you know real venue volume
        timezone_id: "UTC"
        pause_status: UNPAUSED # both Bronze and Silver validated end-to-end;
                                 # running on schedule to start accumulating
                                 # real history for Gold to train on

      tasks:
        - task_key: bronze_dex_pool_events
          notebook_task:
            notebook_path: ../notebooks/00_bronze_dex_ingestion.py
          # new_cluster / existing_cluster_id: fill in when not serverless
        - task_key: silver_token_trades
          depends_on:
            - task_key: bronze_dex_pool_events
          notebook_task:
            notebook_path: ../notebooks/01_silver_token_trades.py
          # Runs right after Bronze each cycle; its own LOOKBACK_MINUTES
          # (see notebook 01) is what makes a 15-min cadence safe, not this
          # depends_on -- it only orders the two tasks within one run.
